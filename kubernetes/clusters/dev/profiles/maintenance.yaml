---
# Node maintenance tooling. Not needed for day-to-day POCs: system-upgrade
# drains and reboots nodes, descheduler evicts pods. Both are opt-in.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-upgrade-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: system-upgrade
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/platform/system-upgrade/app/overlays/dev
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: system-upgrade-config
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: system-upgrade
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: system-upgrade-app
  path: ./kubernetes/platform/system-upgrade/config/overlays/dev
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: descheduler-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/platform/descheduler/app/overlays/dev
  prune: true
  wait: true
