---
# Istio ambient mesh. The istiod/ztunnel monitors are Prometheus Operator CRs,
# so this Kustomization requires the `observability` profile (which installs the
# CRDs). Kiali additionally requires `keycloak` and `secrets`.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: istio-app
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  targetNamespace: istio-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: prometheus-operator-crds
  path: ./kubernetes/platform/istio/app/overlays/dev
  prune: true
  wait: true
---
# Kiali UI for the mesh. Requires the `keycloak` (OIDC), `secrets` (keycloak
# client secret) and `observability` (Prometheus) profiles. Grafana and Tempo
# deep links are disabled in the dev overlay.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kiali-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kiali
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: istio-app
  path: ./kubernetes/platform/kiali/app/overlays/dev
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
