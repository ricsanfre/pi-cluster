---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: strimzi-kafka-operator-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kafka
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/platform/kafka/strimzi-kafka-operator/overlays/dev
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kafka-cluster-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kafka
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: strimzi-kafka-operator-app
  path: ./kubernetes/platform/kafka/cluster/overlays/dev
  prune: true
  wait: true
  timeout: 15m
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  healthCheckExprs:
    - apiVersion: kafka.strimzi.io/v1
      kind: Kafka
      inProgress: "!status.conditions.exists(c, c.type == 'Ready') || status.conditions.filter(c, c.type == 'Ready').all(c, c.status == 'False')"
      current: status.conditions.exists(e, e.type == 'Ready') && status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
