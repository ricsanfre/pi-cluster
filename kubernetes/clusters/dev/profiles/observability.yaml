---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-operator-crds
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kube-system
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/platform/kube-prometheus-stack/prometheus-operator-crds/overlays/dev
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kube-prom-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: prometheus-operator-crds
  path: ./kubernetes/platform/kube-prometheus-stack/app/overlays/dev
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
# Self-contained Grafana: chart installs its own CRDs, admin password generated
# by the operator, Prometheus datasource only (no Vault).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-operator-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: grafana
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: prometheus-operator-crds
  path: ./kubernetes/platform/grafana/operator/overlays/dev
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-instance
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: grafana
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: grafana-operator-app
    - name: kube-prometheus-stack-app
  path: ./kubernetes/platform/grafana/instance/overlays/dev
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-k3s-mixins
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kube-prom-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kube-prometheus-stack-app
  path: ./kubernetes/platform/kube-prometheus-stack/k3s-mixins/overlays/dev
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
# Scrape configs for the lab's external nodes. Targets are unreachable when the
# lab is off; Prometheus reports them down without failing the Kustomization.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: kube-prometheus-stack-externalnodes
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: kube-prom-stack
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: kube-prometheus-stack-app
  path: ./kubernetes/platform/kube-prometheus-stack/externalnodes-monitoring/overlays/dev
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
