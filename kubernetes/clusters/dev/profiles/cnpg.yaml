---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: databases
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/platform/databases/cloudnative-pg/app/overlays/dev
  prune: true
  wait: true
  timeout: 10m
