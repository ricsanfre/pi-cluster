---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velero-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: velero
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/platform/velero/app/overlays/dev
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: velero-config
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: velero
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: velero-app
  path: ./kubernetes/platform/velero/config/overlays/dev
  prune: true
  wait: true
