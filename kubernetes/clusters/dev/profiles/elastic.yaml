---
# Elastic stack (ECK operator, Elasticsearch, Kibana) with the Fluentd
# aggregator and the Prometheus exporter. Requires the `secrets` profile: the
# Elasticsearch exporter and Fluentd credentials come from Vault.
# Elasticsearch needs vm.max_map_count=262144 on the Docker host unless
# node.store.allow_mmap is false (it is, in this repo).
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: eck-operator-app
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  targetNamespace: elastic
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./kubernetes/platform/eck-operator/app/overlays/dev
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: elastic-stack-app
  namespace: flux-system
spec:
  interval: 30m
  timeout: 15m
  targetNamespace: elastic
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: eck-operator-app
  path: ./kubernetes/platform/elastic-stack/app/overlays/dev
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prometheus-elasticsearch-exporter-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: elastic
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: elastic-stack-app
    - name: external-secrets-config
  path: ./kubernetes/platform/elastic-stack/prometheus-elasticsearch-exporter/overlays/dev
  prune: true
  wait: true
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: fluentd-app
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: fluent
  sourceRef:
    kind: GitRepository
    name: flux-system
  dependsOn:
    - name: elastic-stack-app
    - name: external-secrets-config
  path: ./kubernetes/platform/fluent/fluentd/overlays/dev
  prune: true
  wait: true
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
