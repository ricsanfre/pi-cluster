apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: databases
resources:
  - ../../base

components:
  - ../../components/backup
  - ../../components/anti-affinity
  - ../../components/istio
  - ../../components/mongodb-monitor
  - ../../components/valkey-monitor

patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: postgres-ecommerce
    path: postgres-patch.yaml
  - target:
      group: mongodbcommunity.mongodb.com
      kind: MongoDBCommunity
      name: mongodb
    path: mongodb-patch.yaml
