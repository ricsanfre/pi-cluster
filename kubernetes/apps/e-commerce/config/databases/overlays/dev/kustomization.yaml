apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: databases

# Self-contained dev databases: single instance/member, local-path storage, no
# Barman backups, no Istio peer authentication and no ServiceMonitor/Grafana
# resources (those are prod-only components).
resources:
  - ../../base

patches:
  - target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: postgres-ecommerce
    path: postgres-patch.yaml
