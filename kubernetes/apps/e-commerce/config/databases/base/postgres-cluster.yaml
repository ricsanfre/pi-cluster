# CloudNativePG — E-commerce PostgreSQL Cluster
# Namespace: databases
# Base shape: 1 instance and 5Gi. The prod overlay sets 2 instances and 10Gi;
# the backup configuration lives in components/backup (prod only).
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-ecommerce
  namespace: databases
spec:
  instances: 1

  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  postgresql:
    parameters:
      shared_buffers: "64MB"
      max_connections: "100"

  bootstrap:
    initdb: {}

  storage:
    size: 5Gi
    storageClass: ${STORAGE_CLASS:=longhorn}

  monitoring:
    enablePodMonitor: true
    podMonitorRelabelings:
      - sourceLabels: [__meta_kubernetes_namespace]
        targetLabel: namespace
      - sourceLabels: [__meta_kubernetes_pod_name]
        targetLabel: pod

  managed:
    roles:
      - name: users_owner
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: users-db-secret
      - name: orders_owner
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: orders-db-secret
