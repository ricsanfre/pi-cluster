apiVersion: upgrade.cattle.io/v1
kind: Plan
metadata:
  name: k3s-agent
  namespace: system-upgrade
  labels:
    k3s-upgrade: agent
spec:
  nodeSelector:
    matchExpressions:
      - key: node-role.kubernetes.io/control-plane
        operator: DoesNotExist
  serviceAccountName: system-upgrade
  # Wait for k3s-server upgrade plan to complete before executing k3s-agent plan.
  # The Plan CRD has no `dependsOn` field, so sequencing is done with a prepare
  # step. The job is created immediately and blocks in this container, which
  # means jobActiveDeadlineSecs must cover the whole server rollout plus the
  # agent upgrade - not just the agent upgrade.
  # Raise this value here only. Editing the k3s-server plan changes its hash and
  # re-triggers the control-plane rollout.
  prepare:
    image: rancher/k3s-upgrade
    args:
      - prepare
      - k3s-server
  concurrency: 1
  jobActiveDeadlineSecs: 3600
  # Cordon node before upgrade it
  cordon: true
  upgrade:
    image: rancher/k3s-upgrade
  # renovate: datasource=github-releases depName=k3s-io/k3s
  version: v1.37.2+k3s1