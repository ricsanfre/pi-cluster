apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: databases
resources:
  - ../../base

components:
  - ../../components/backup
  - ../../components/anti-affinity
  - ../../components/istio

patches:
  - path: postgres-cluster-patch.yaml
    target:
      group: postgresql.cnpg.io
      kind: Cluster
      name: postgres-keycloak
