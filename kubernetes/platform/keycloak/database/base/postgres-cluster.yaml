# CloudNativePG — Keycloak PostgreSQL Cluster
# Namespace: databases
# Instances and storage are sized per environment by the overlays.
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-keycloak
  namespace: databases
spec:
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  postgresql:
    parameters:
      shared_buffers: "64MB"
      max_connections: "100"

  bootstrap:
    initdb: {}

  monitoring:
    enablePodMonitor: true
    podMonitorRelabelings:
      - sourceLabels: [__meta_kubernetes_namespace]
        targetLabel: namespace
      - sourceLabels: [__meta_kubernetes_pod_name]
        targetLabel: pod

  managed:
    roles:
      - name: keycloak_owner
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: keycloak-db-secret
