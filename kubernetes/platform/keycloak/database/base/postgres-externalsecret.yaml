# ExternalSecrets — Keycloak PostgreSQL (databases namespace)
# Backed by Vault via ClusterSecretStore 'vault-backend'.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-db-externalsecret
  namespace: databases
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-db-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: /keycloak/database/keycloak-db
