# tempo helm values (dev overlay)
#
# Keep the distributed chart (it is what the repo already pins) but scale every
# component to one replica and use local filesystem storage. No S3/External
# Secrets, so the tracing profile does not require the secrets profile.

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal

distributor:
  replicas: 1
ingester:
  replicas: 1
querier:
  replicas: 1
queryFrontend:
  replicas: 1
compactor:
  replicas: 1
metricsGenerator:
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 256Mi
