apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tempo

resources:
  - ../../base

components:
  - ../../components/s3-backend

configMapGenerator:
  - name: tempo-helm-values
    behavior: merge
    files:
      - overlay-values.yaml=values.yaml

patches:
- target:
    group: helm.toolkit.fluxcd.io
    kind: HelmRelease
    name: tempo
  path: helm-patch.yaml