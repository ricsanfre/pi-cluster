# vault helm values (dev overlay)
#
# Dev Vault runs outside the cluster as a Docker Compose container (dev mode)
# and pods reach it at vault.picluster.local.test, which the dev CoreDNS overlay
# answers. It serves TLS with the dev CA; workloads that talk to it need that CA
# (see docs/_docs/dev.md#private-pki-dev-only).
global:
  externalVaultAddr: "https://vault.picluster.local.test:8200"
