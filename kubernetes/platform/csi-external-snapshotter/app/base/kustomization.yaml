apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kube-system
resources:
# Longhorn 1.13.0 pairs with CSI snapshotter v8.6.0: the longhorn-system csi-snapshotter
# deployment runs longhornio/csi-snapshotter:v8.6.0.
# Upstream's deploy/kubernetes/snapshot-controller tree lags its own tag by one release,
# so ref v8.7.1 still deploys
# registry.k8s.io/sig-storage/snapshot-controller:v8.6.0 - the version Longhorn documents.
# The CRDs are byte-identical between v8.7.0 and v8.7.1.
# Re-check this pairing whenever the ref starts deploying a controller newer than v8.6.0.
- https://github.com/kubernetes-csi/external-snapshotter/client/config/crd/?ref=v8.7.1
- https://github.com/kubernetes-csi/external-snapshotter/deploy/kubernetes/snapshot-controller/?ref=v8.7.1