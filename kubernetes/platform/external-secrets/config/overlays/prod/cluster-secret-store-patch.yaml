# Prod talks to the in-cluster Vault over HTTPS and authenticates with the
# Kubernetes auth method using the external-secrets service account.
- op: add
  path: /spec/provider/vault/server
  value: "https://vault.${CLUSTER_DOMAIN}:8200"
- op: add
  path: /spec/provider/vault/auth
  value:
    kubernetes:
      mountPath: "kubernetes"
      role: "external-secrets"
      serviceAccountRef:
        name: "external-secrets"
        namespace: "external-secrets"
        audiences:
          - "https://kubernetes.default.svc.cluster.local"
