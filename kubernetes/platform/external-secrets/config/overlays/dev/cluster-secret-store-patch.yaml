# Dev uses the optional external Vault container (dev mode) instead of the
# in-cluster prod Vault. Token auth keeps the dev bootstrap simple; no
# Kubernetes auth configuration is needed.
#
# Vault serves TLS with the dev CA, so the store trusts it through the
# `vault-ca` Secret that `make dev-seed-ca` creates in this namespace.
- op: add
  path: /spec/provider/vault/server
  value: https://vault.picluster.local.test:8200
- op: add
  path: /spec/provider/vault/caProvider
  value:
    type: Secret
    name: vault-ca
    key: ca.crt
    namespace: external-secrets
- op: add
  path: /spec/provider/vault/auth
  value:
    tokenSecretRef:
      name: vault-token
      key: token
