# descheduler helm values (base)
#
# Runs as a Deployment (continuous mode) with two balance strategies:
#   - LowNodeUtilization: evicts pods from nodes above target thresholds
#     when other nodes exist below the lower thresholds
#   - RemoveDuplicates: spreads pods of the same ReplicaSet/StatefulSet
#     across different nodes

kind: Deployment
deschedulingInterval: 5m
replicas: 1

image:
  repository: registry.k8s.io/descheduler/descheduler
  tag: ""          # use chart appVersion
  pullPolicy: IfNotPresent

# The chart default is requests/limits 500m CPU and 256Mi memory. That request
# is charged against whatever node the pod lands on: on 2026-11-21 the pod was
# scheduled to node-hp-3 and its 500m alone took that node from 85% to 98% of
# CPU requests, which is what tipped LowNodeUtilization into evicting again.
# Measured usage is ~2m CPU and 15Mi steady, with a 141Mi transient while the
# informer caches are built at start-up, and 0% CFS throttling at the 500m
# limit, so keep the limit and shrink the request.
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 256Mi

leaderElection:
  enabled: true

deschedulerPolicyAPIVersion: descheduler/v1alpha2
deschedulerPolicy:
  # Bound the churn: without a cap a single cycle can evict every removable pod
  # of an overutilized node at once, which is far more disruptive than the
  # imbalance it fixes. 3 pods per node per 5m cycle converges in minutes.
  maxNoOfPodsToEvictPerNode: 3
  profiles:
    - name: default
      pluginConfig:
        - name: DefaultEvictor
          args:
            podProtections:
              defaultDisabled:
              - PodsWithLocalStorage
              extraEnabled:
              - PodsWithPVC
            evictLocalStoragePods: false
            evictSystemCriticalPods: false
            # Cluster-critical namespaces are never eviction candidates.
            # v1alpha2 dropped `excludedNamespaces`, so the exclusion is
            # expressed as a namespace selector: `kubernetes.io/metadata.name`
            # is applied automatically to every namespace. This is the
            # protection the prod overlay comment has always claimed; without
            # it the cert-manager webhook, the Flux controllers and
            # snapshot-controller were evicted on every cycle.
            namespaceLabelSelector:
              matchExpressions:
              - key: kubernetes.io/metadata.name
                operator: NotIn
                values:
                - kube-system
                - cert-manager
                - flux-system
            # nodeFit disabled: the descheduler's nodeFit check fails when
            # control-plane nodes are tainted with NoSchedule, because it
            # evaluates the pod against ALL nodes (including tainted ones)
            # rather than requiring fit on just one valid node.
            # Pods will still be correctly scheduled by kube-scheduler on
            # the actual untargeted node (node-hp-2) after eviction.
            nodeFit: false
        - name: LowNodeUtilization
          args:
            # A node is underutilized only when *every* dimension is below
            # `thresholds`, and overutilized when *any* dimension is above
            # `targetThresholds`.
            #
            # The previous 20/20/20 was unreachable: the x86 workers sit at
            # 42-55% of CPU requests, so the only nodes ever considered
            # underutilized were the tainted control-plane nodes (~13%). Every
            # candidate eviction was then skipped with "doesn't tolerate node
            # taint", so node5 could stay at 99% of requests indefinitely while
            # the cluster reported nothing to do.
            #
            # 60% admits the x86 workers as targets, while a node at 70% of
            # requests is still not a source.
            #
            # 2026-11-21: the CPU target was raised from 80 to 90. Both x86
            # workers sit above 80% of requests (node-hp-1 81%, node-hp-3
            # 85-87%) while idling at 38-43% of *actual* CPU, so every 5-minute
            # cycle evicted 3 pods from each of them — 195 evictions in four
            # hours, including the CNPG and cert-manager controllers and
            # tempo-ingester — and the scheduler put them back on the same
            # nodes. 90 keeps LowNodeUtilization meaningful for genuine request
            # pressure without chasing over-reservation. Rebalancing the
            # requests themselves (and retiring this strategy if it cannot
            # help, since the only under-utilized nodes are the tainted
            # control-plane ones) is the follow-up.
            thresholds:
              cpu: 60
              memory: 40
              pods: 40
            targetThresholds:
              cpu: 90
              memory: 70
              pods: 60
        - name: RemoveDuplicates
      plugins:
        balance:
          enabled:
          - RemoveDuplicates
          - LowNodeUtilization
        deschedule:
          enabled: []
# Exclude critical system namespaces from eviction to prevent
# disruption of the control plane and GitOps pipeline.
cmdOptions:
  v: 3
