# descheduler helm values (prod overlay)
#
serviceMonitor:
  enabled: false

# Eviction of kube-system, cert-manager and flux-system is excluded in the
# base policy (DefaultEvictor `namespaceLabelSelector`), not here: Helm replaces
# lists on merge, so a profile override in this overlay would drop the whole
# pluginConfig block.
cmdOptions:
  v: 4
