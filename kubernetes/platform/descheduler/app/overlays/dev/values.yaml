# descheduler helm values (dev overlay)
#
# Dev-specific overrides. The descheduler is not needed in dev (k3d)
# environments where all pods run on a single node by design.
# Set replicas to 0 to effectively disable it.
#
# No dev profile enables this app; it is kept as an explicit opt-out rather
# than as part of clusters/dev/profiles/kustomization.yaml.
replicas: 0
