# flux-instance helm values (prod overlay)
instance:
  sync:
    kind: GitRepository
    url: https://github.com/ricsanfre/pi-cluster
    ref: refs/heads/master
    path: kubernetes/clusters/prod
    interval: 1h
    ignore: |
      /ansible/
      /ansible-runner/
      /design/
      /docs/
      /metal/
      /test/
  kustomize:
    patches:
      - # Shared controller flags: the dependency requeue and a leader-election window that survives
        # the latency spike of a CRD apply. A slow API used to exceed the default lease
        # (15s/renew 10s) and kill the controller with "leader election lost", restarting every
        # in-flight reconcile. Keep --requeue-dependency short: it multiplies through the dependency
        # chain, so 30s made a full cascade ~3x slower.
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --requeue-dependency=5s
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --leader-election-lease-duration=60s
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --leader-election-renew-deadline=40s
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --leader-election-retry-period=5s
        target:
          kind: Deployment
          name: (kustomize-controller|helm-controller|source-controller)
      # Concurrency per controller, because only kustomize-controller drives the apply burst:
      # measured busiest apiserver series 20 req/s at concurrency 20 vs 8 req/s at 3, and
      # slow_apply 316/min vs 146/min. helm-controller applies release manifests; source-controller
      # only fetches artifacts and needs no throttle.
      - # kustomize-controller: the server-side applies (the writes)
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=4
        target:
          kind: Deployment
          name: kustomize-controller
      - # helm-controller: Helm upgrades
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=6
        target:
          kind: Deployment
          name: helm-controller
      - # source-controller: artifact fetches, no API write pressure
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=10
        target:
          kind: Deployment
          name: source-controller
      - # Increase the memory limits
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: all
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      limits:
                        memory: 2Gi
        target:
          kind: Deployment
          name: (kustomize-controller|helm-controller|source-controller)
      - # Enable in-memory kustomize builds (the concurrency override moved to the shared patch)
        patch: |
          - op: replace
            path: /spec/template/spec/volumes/0
            value:
              name: temp
              emptyDir:
                medium: Memory
        target:
          kind: Deployment
          name: kustomize-controller
      - # Enable Helm repositories caching
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --helm-cache-max-size=10
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --helm-cache-ttl=60m
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --helm-cache-purge-interval=5m
        target:
          kind: Deployment
          name: source-controller
      - # Flux near OOM detection for Helm
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --feature-gates=OOMWatch=true
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --oom-watch-memory-threshold=95
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --oom-watch-interval=500ms
        target:
          kind: Deployment
          name: helm-controller