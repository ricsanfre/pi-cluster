# flux-instance helm values (prod overlay)
instance:
  sync:
    kind: GitRepository
    url: https://github.com/ricsanfre/pi-cluster
    ref: refs/heads/master
    path: kubernetes/clusters/prod
    interval: 1h
    ignore: |
      /ansible/
      /ansible-runner/
      /design/
      /docs/
      /metal/
      /test/
  kustomize:
    patches:
      - # Right-size the worker pool, the dependency requeue and the leader-election window.
        # 20 concurrent Kustomizations meant 20 simultaneous server-side applies after every new
        # revision, which is what saturates the 4-core Pi control plane on a CRD apply. A slow API
        # also used to exceed the default lease (15s/renew 10s) and kill the controller with
        # "leader election lost", restarting every in-flight reconcile.
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --concurrent=3
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --requeue-dependency=30s
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --leader-election-lease-duration=60s
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --leader-election-renew-deadline=40s
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --leader-election-retry-period=5s
        target:
          kind: Deployment
          name: (kustomize-controller|helm-controller|source-controller)
      - # Increase the memory limits
        patch: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: all
          spec:
            template:
              spec:
                containers:
                  - name: manager
                    resources:
                      limits:
                        memory: 2Gi
        target:
          kind: Deployment
          name: (kustomize-controller|helm-controller|source-controller)
      - # Enable in-memory kustomize builds (the concurrency override moved to the shared patch)
        patch: |
          - op: replace
            path: /spec/template/spec/volumes/0
            value:
              name: temp
              emptyDir:
                medium: Memory
        target:
          kind: Deployment
          name: kustomize-controller
      - # Enable Helm repositories caching
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --helm-cache-max-size=10
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --helm-cache-ttl=60m
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --helm-cache-purge-interval=5m
        target:
          kind: Deployment
          name: source-controller
      - # Flux near OOM detection for Helm
        patch: |
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --feature-gates=OOMWatch=true
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --oom-watch-memory-threshold=95
          - op: add
            path: /spec/template/spec/containers/0/args/-
            value: --oom-watch-interval=500ms
        target:
          kind: Deployment
          name: helm-controller