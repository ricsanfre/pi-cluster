apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

resources:
  - grafana-dashboards.yaml

configMapGenerator:
  - name: external-dns-helm-values
    behavior: merge
    files:
      - monitoring-values.yaml=values.yaml

patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
      name: external-dns
    path: helm-patch.yaml
