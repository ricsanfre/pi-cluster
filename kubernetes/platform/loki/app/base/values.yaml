# loki helm values (base)
#
# Only settings shared by every environment. Deployment mode, storage backend,
# retention/compactor storage settings and replicas are overlay concerns.

loki:
  # Disable multi-tenant support
  auth_enabled: false

  limits_config:
    allow_structured_metadata: true
    max_query_lookback: 168h
    # Retention period for logs in the store.
    retention_period: 168h
    # OLTP limit settings
    otlp_config:
      resource_attributes:
        ignore_defaults: true
        attributes_config:
          - action: index_label
            attributes:
              - service.name
              - service.namespace
              - k8s.namespace.name

  # Compactor configuration
  # ref: https://grafana.com/docs/loki/latest/operations/storage/retention/
  # retention_enabled and delete_request_store are storage-specific and live
  # in the overlays.
  compactor:
    compaction_interval: 10m
    retention_delete_delay: 2h
    working_directory: /var/loki/retention

# Disable minio installation
minio:
  enabled: false

# Disable self-monitoring
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false

# Disable helm-test
test:
  enabled: false
