# loki helm values (prod overlay)
#
# Simple scalable deployment backed by RustFS (S3) and Longhorn.

deploymentMode: SimpleScalable

loki:
  commonConfig:
    replication_factor: 1

  compactor:
    # S3 does not delete objects, so retention must be driven by the compactor.
    delete_request_store: s3
    retention_enabled: true

  # S3 backend storage configuration
  storage:
    bucketNames:
      chunks: k3s-loki
      ruler: k3s-loki
    type: s3
    s3:
      endpoint: "https://${S3_SERVER}:9091"
      region: eu-west-1
      secretAccessKey: $${S3_SECRET_ACCESS_KEY}
      accessKeyId: $${S3_ACCESS_KEY_ID}
      s3ForcePathStyle: true
      insecure: false
      http_config:
        idle_conn_timeout: 90s
        response_header_timeout: 0s
        insecure_skip_verify: false

  # Storage schema
  schemaConfig:
    configs:
    - from: 2024-04-01
      store: tsdb
      index:
        prefix: loki_index_
        period: 24h
      object_store: s3
      schema: v13

# Configuration for the write component
write:
  replicas: 1
  persistence:
    size: 1Gi
    storageClass: longhorn
  # Enable environment variables in config file
  # https://grafana.com/docs/loki/latest/configuration/#use-environment-variables-in-the-configuration
  extraArgs:
    - '-config.expand-env=true'
  extraEnv:
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: loki-s3-secret
          key: S3_ACCESS_KEY_ID
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: loki-s3-secret
          key: S3_SECRET_ACCESS_KEY
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Reduce memcached cache sizes from massive defaults (8GB/1GB) to homelab-appropriate values
# Defaults: chunksCache.allocatedMemory=8192, resultsCache.allocatedMemory=1024
chunksCache:
  allocatedMemory: 256
  allocatedCPU: 100m

resultsCache:
  allocatedMemory: 128
  allocatedCPU: 100m

# Configuration for the backend component
backend:
  replicas: 1
  persistence:
    size: 1Gi
    storageClass: longhorn
  # Enable environment variables in config file
  # https://grafana.com/docs/loki/latest/configuration/#use-environment-variables-in-the-configuration
  extraArgs:
    - '-config.expand-env=true'
  extraEnv:
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: loki-s3-secret
          key: S3_ACCESS_KEY_ID
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: loki-s3-secret
          key: S3_SECRET_ACCESS_KEY
  # Resource limits for Loki components
  # Actual usage: backend 166-257Mi, read 131-167Mi, write 97-114Mi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Configuration for the read component
read:
  replicas: 1
  persistence:
    size: 1Gi
    storageClass: longhorn
  # Enable environment variables in config file
  # https://grafana.com/docs/loki/latest/configuration/#use-environment-variables-in-the-configuration
  extraArgs:
    - '-config.expand-env=true'
  extraEnv:
    - name: S3_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: loki-s3-secret
          key: S3_ACCESS_KEY_ID
    - name: S3_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: loki-s3-secret
          key: S3_SECRET_ACCESS_KEY
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# Configuration for the gateway
gateway:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi
