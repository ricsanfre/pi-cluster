# coredns helm values (dev overlay)
#
# Pods have no DNS path to the laptop resolver: CoreDNS forwards to the node's
# /etc/resolv.conf (Docker embedded DNS), whose upstream is a loopback stub that
# is unreachable from a container namespace. The dev zone is answered here
# instead, mirroring how production reaches the same external services by name:
#
#   template rustfs / vault -> their external-service container addresses
#   template the rest of the zone (single label) -> the Envoy Gateway LB address
#
# `servers` is a list, so Helm replaces the base value rather than merging it:
# keep this block in sync with kubernetes/platform/coredns/app/base/values.yaml.

servers:
- zones:
  - zone: .
  port: 53
  plugins:
  - name: errors
  # Serves a /health endpoint on :8080, required by the livenessProbe
  - name: health
    configBlock: |-
      lameduck 5s
  # Serves a /ready endpoint on :8181, required by the readinessProbe
  - name: ready
  # Required to query the Kubernetes API for data
  - name: kubernetes
    parameters: cluster.local in-addr.arpa ip6.arpa
    configBlock: |-
      pods insecure
      fallthrough in-addr.arpa ip6.arpa
      ttl 30
  # The three template instances share the zone and chain through
  # `fallthrough`: the two exact names are answered first, everything else in
  # the zone (single label only, matching the certificate) goes to the gateway.
  # A single `hosts` block cannot coexist with a zone-scoped template — the
  # template answers for the whole zone before hosts is reached.
  - name: template
    parameters: IN A picluster.local.test
    configBlock: |-
      match "^rustfs\.picluster\.local\.test\.$"
      answer "{{ .Name }} 60 IN A 172.30.100.10"
      fallthrough
  - name: template
    parameters: IN A picluster.local.test
    configBlock: |-
      match "^vault\.picluster\.local\.test\.$"
      answer "{{ .Name }} 60 IN A 172.30.100.11"
      fallthrough
  - name: template
    parameters: IN A picluster.local.test
    configBlock: |-
      match "^[a-z0-9-]+\.picluster\.local\.test\.$"
      answer "{{ .Name }} 60 IN A 172.30.200.1"
      fallthrough
  # Serves a /metrics endpoint on :9153, required by the ServiceMonitor
  - name: prometheus
    parameters: 0.0.0.0:9153
  - name: forward
    parameters: . /etc/resolv.conf
  - name: cache
    parameters: 30
  - name: loop
  - name: reload
  - name: loadbalance
