apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: kafka

resources:
  - ../../base

patches:
  - path: kafka-patch.yaml
    target:
      group: kafka.strimzi.io
      kind: Kafka
      name: cluster
  - path: node-pool-patch.yaml
    target:
      group: kafka.strimzi.io
      kind: KafkaNodePool
      name: dual-role
