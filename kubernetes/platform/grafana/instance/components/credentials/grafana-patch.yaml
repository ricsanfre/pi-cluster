- op: replace
  path: /spec/disableDefaultAdminSecret
  value: true
# Insert admin credentials first so the resulting env list keeps the same
# order the base manifest used (admin user, admin password, plugins).
- op: add
  path: /spec/deployment/spec/template/spec/containers/0/env/0
  value:
    name: GF_SECURITY_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: grafana
        key: admin-password
- op: add
  path: /spec/deployment/spec/template/spec/containers/0/env/0
  value:
    name: GF_SECURITY_ADMIN_USER
    valueFrom:
      secretKeyRef:
        name: grafana
        key: admin-user
