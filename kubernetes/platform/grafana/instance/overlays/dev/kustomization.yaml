apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: grafana

# Self-contained dev Grafana: operator-generated admin credentials, Prometheus
# datasource only, local-path persistence. No Vault, SSO, route or Elasticsearch.
resources:
  - ../../base

components:
  - ../../components/prometheus
  - ../../components/monitoring
  - ../../components/persistence
