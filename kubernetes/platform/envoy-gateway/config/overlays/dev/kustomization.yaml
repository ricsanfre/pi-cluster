apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy-gateway-system

resources:
  - ../../base

patches:
  - path: certificate-patch.yaml
    target:
      group: cert-manager.io
      kind: Certificate
      name: pi-cluster-tls
  - path: envoy-proxy-patch.yaml
    target:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: envoy
