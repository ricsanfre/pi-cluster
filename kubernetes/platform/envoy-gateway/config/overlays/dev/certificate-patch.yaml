apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pi-cluster-tls
spec:
  # Dev uses the self-signed CA issuer created by the cert-manager profile.
  # The prod overlay/base uses the ACME letsencrypt-issuer instead.
  issuerRef:
    kind: ClusterIssuer
    name: ca-issuer
  duration: 720h
