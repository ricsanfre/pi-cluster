apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: node-exporter
spec:
  staticConfigs:
    - targets:
        - node1.${CLUSTER_DOMAIN}:9100
  metricsPath: /metrics
  relabelings:
    - action: replace
      targetLabel: job
      replacement: node-exporter
    # Give external nodes the label the cluster nodes get from their ServiceMonitor,
    # so dashboards and alerts can select `kubernetes_node` uniformly.
    # instance is node1.homelab.ricsanfre.com:9100
    - action: replace
      sourceLabels:
        - instance
      regex: '([^.]+)\..*'
      targetLabel: kubernetes_node
      replacement: '$1'