---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: rpi-power
  labels:
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  allowCrossNamespaceImport: true
  folder: Infrastructure
  instanceSelector:
    matchLabels:
      dashboards: grafana
  json: |-
    {
      "__inputs": [],
      "__requires": [],
      "annotations": {
        "list": []
      },
      "editable": false,
      "graphTooltip": 0,
      "links": [],
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Under-voltage alarm (now)",
          "description": "rpi_under_voltage_alarm: 1 means the firmware is capping the ARM clock right now.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "rpi_under_voltage_alarm",
              "instant": true,
              "legendFormat": "{{kubernetes_node}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Throttle flags (now)",
          "description": "Bits 0-2 of vcgencmd get_throttled: under-voltage, frequency capped, throttled.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 8,
            "y": 0
          },
          "targets": [
            {
              "expr": "rpi_throttled_bits % 2",
              "instant": true,
              "legendFormat": "{{kubernetes_node}} under-voltage"
            },
            {
              "expr": "floor(rpi_throttled_bits / 2) % 2",
              "instant": true,
              "legendFormat": "{{kubernetes_node}} freq capped"
            },
            {
              "expr": "floor(rpi_throttled_bits / 4) % 2",
              "instant": true,
              "legendFormat": "{{kubernetes_node}} throttled"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 6,
          "type": "stat",
          "title": "Since boot: has it happened?",
          "description": "Sticky bits 16 and 18: under-voltage or throttling occurred since boot, even if the live alarm is 0.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 16,
            "y": 0
          },
          "targets": [
            {
              "expr": "floor(rpi_throttled_bits / 65536) % 2",
              "instant": true,
              "legendFormat": "{{kubernetes_node}} under-voltage seen"
            },
            {
              "expr": "floor(rpi_throttled_bits / 262144) % 2",
              "instant": true,
              "legendFormat": "{{kubernetes_node}} throttling seen"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "orange",
                    "value": 1
                  }
                ]
              },
              "color": {
                "mode": "thresholds"
              }
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": [
                "lastNotNull"
              ],
              "fields": "",
              "values": false
            },
            "colorMode": "background",
            "graphMode": "none",
            "textMode": "auto"
          }
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "ARM clock",
          "description": "rpi_arm_clock_hz from vcgencmd. A sustained drop is what under-voltage looks like from the inside.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 6
          },
          "targets": [
            {
              "expr": "rpi_arm_clock_hz",
              "legendFormat": "{{kubernetes_node}}",
              "intervalFactor": 2
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "hertz",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Core voltage",
          "description": "rpi_core_volts. Below ~0.85 V under load usually means the PSU or cable is marginal.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 6
          },
          "targets": [
            {
              "expr": "rpi_core_volts",
              "legendFormat": "{{kubernetes_node}}",
              "intervalFactor": 2
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "volt",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "SoC temperature",
          "description": "rpi_temp_celsius.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 0,
            "y": 13
          },
          "targets": [
            {
              "expr": "rpi_temp_celsius",
              "legendFormat": "{{kubernetes_node}}",
              "intervalFactor": 2
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "celsius",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Collector freshness",
          "description": "Seconds since rpi_metrics last rewrote rpi.prom. Above 300 s the timer is stuck or the file is not being read.",
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "gridPos": {
            "h": 7,
            "w": 12,
            "x": 12,
            "y": 13
          },
          "targets": [
            {
              "expr": "time() - node_textfile_mtime_seconds{file=~\".*rpi.*\"}",
              "legendFormat": "{{kubernetes_node}}",
              "intervalFactor": 2
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {
                "fillOpacity": 10,
                "showPoints": "never"
              }
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi",
              "sort": "desc"
            }
          }
        }
      ],
      "refresh": "30s",
      "schemaVersion": 39,
      "style": "dark",
      "tags": [
        "raspberry-pi",
        "power"
      ],
      "templating": {
        "list": [
          {
            "current": {
              "text": "default",
              "value": "default"
            },
            "hide": 0,
            "label": "Data Source",
            "name": "datasource",
            "options": [],
            "query": "prometheus",
            "refresh": 1,
            "regex": "",
            "type": "datasource"
          }
        ]
      },
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "timepicker": {
        "refresh_intervals": [
          "10s",
          "30s",
          "1m",
          "5m",
          "15m",
          "30m",
          "1h"
        ]
      },
      "timezone": "browser",
      "title": "Raspberry Pi / Power and throttling"
    }
