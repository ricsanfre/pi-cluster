# kube-prometheus-stack helm values (prod overlay)

# node_exporter scrapes the Raspberry Pi power/clock metrics written by the
# Ansible `rpi_metrics` role (vcgencmd under-voltage state and clock cap).
# Prod-only: the k3d dev cluster has no ARM nodes and no collector.
prometheus-node-exporter:
  extraArgs:
    - --collector.textfile.directory=/host/textfile
  extraHostVolumeMounts:
    - name: textfile
      hostPath: /var/lib/node_exporter/textfile
      mountPath: /host/textfile
      readOnly: true

# AlertManager configuration
alertmanager:
  alertmanagerSpec:
    # Configure access to AlertManager via subdomain
    externalUrl: http://alertmanager.${CLUSTER_DOMAIN}
    # HA configuration: number of Alertmanager pods
    replicas: 1
    # POD storage
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ${STORAGE_CLASS:=longhorn}
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

prometheus:
  prometheusSpec:
    # Retention data configuration
    retention: 14d
    retentionSize: 50GB
    # Limit POD resources
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 1800Mi
    # POD storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ${STORAGE_CLASS:=longhorn}
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

