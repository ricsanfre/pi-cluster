# kube-prometheus-stack helm values (prod overlay)

# AlertManager configuration
alertmanager:
  alertmanagerSpec:
    # Configure access to AlertManager via subdomain
    externalUrl: http://alertmanager.${CLUSTER_DOMAIN}
    # HA configuration: number of Alertmanager pods
    replicas: 1
    # POD storage
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: ${STORAGE_CLASS:=longhorn}
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi

prometheus:
  prometheusSpec:
    # Retention data configuration
    retention: 14d
    retentionSize: 50GB
    # Limit POD resources
    resources:
      requests:
        cpu: 100m
        memory: 1Gi
      limits:
        memory: 1800Mi
    # POD storage
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: ${STORAGE_CLASS:=longhorn}
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# Raspberry Pi power metrics.
#
# The collector runs on the host (Ansible role `rpi_metrics`) and writes
# /var/lib/node_exporter/textfile/rpi.prom. node_exporter reads that directory
# through the host mount below.
#
# type: DirectoryOrCreate matters: node_exporter is a DaemonSet, so this volume
# is mounted on the x86 nodes too, where the collector never writes anything. An
# empty directory is harmless (the textfile collector exports nothing and
# node_textfile_scrape_error stays 0); a missing one is not, because the pod
# would fail to start and the node would lose every node_exporter metric.
prometheus-node-exporter:
  extraArgs:
    - --collector.textfile.directory=/host/textfile
  extraHostVolumeMounts:
    - name: textfile
      hostPath: /var/lib/node_exporter/textfile
      type: DirectoryOrCreate
      mountPath: /host/textfile
      readOnly: true

