# kube-prometheus-stack helm values (dev overlay)
#
# Tuned for a single-node laptop cluster: no Alertmanager, no Grafana,
# 7-day / 5 GB retention, local-path storage.

alertmanager:
  enabled: false

grafana:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 7d
    retentionSize: 5GB
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

# k3s does not expose these as pods, and k3d cannot reach the prod endpoints.
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false

kubeApiServer:
  enabled: true
kubelet:
  enabled: true
coreDns:
  enabled: true
nodeExporter:
  enabled: true
kube-state-metrics:
  enabled: true
