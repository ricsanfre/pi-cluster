apiVersion: v1
kind: Namespace
metadata:
  name: poc-template
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: poc-quota
  namespace: poc-template
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 3Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: poc-limits
  namespace: poc-template
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
