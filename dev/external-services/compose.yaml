---
# Development-only external services for the k3d environment.
#
# RustFS is always started. Vault is opt-in:
#   docker compose --profile vault up -d
#
# The `picluster` network is created by dev/create_cluster.sh. Services use
# fixed IPs so Kubernetes Services/EndpointSlices can reach them without
# relying on Docker DNS from nested pod network namespaces.
name: dev-external-services

services:
  rustfs-perms:
    image: alpine:3.22
    user: "0:0"
    restart: "no"
    volumes:
      - ./data/rustfs:/fix/data
      - ./data/logs:/fix/logs
      - ./certs:/fix/certs
    # Only the RustFS keypair needs the service UID. Chowning /fix/certs
    # recursively would take ownership of ca.key away from the invoking user,
    # breaking gen-certs.sh re-issues and `make dev-seed-ca`.
    command:
      - sh
      - -c
      - |
        mkdir -p /fix/data /fix/logs
        chown -R 10001:10001 /fix/data /fix/logs
        for f in /fix/certs/rustfs_cert.pem /fix/certs/rustfs_key.pem; do
          [ -f "$$f" ] && chown 10001:10001 "$$f" || true
        done

  rustfs:
    image: rustfs/rustfs:1.0.4
    container_name: dev-rustfs
    restart: unless-stopped
    depends_on:
      rustfs-perms:
        condition: service_completed_successfully
    networks:
      picluster:
        ipv4_address: 172.30.100.10
    ports:
      - "127.0.0.1:9091:9091"
      - "127.0.0.1:9092:9092"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:?set RUSTFS_ACCESS_KEY in .env}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:?set RUSTFS_SECRET_KEY in .env}
      RUSTFS_ADDRESS: ":9091"
      RUSTFS_CONSOLE_ADDRESS: ":9092"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_TLS_PATH: "/certs"
      RUSTFS_OBS_LOGGER_LEVEL: "error"
      RUSTFS_OBS_LOG_DIRECTORY: "/var/log/rustfs/"
    volumes:
      - ./data/rustfs:/data
      - ./data/logs:/var/log/rustfs
      - ./certs:/certs:ro
    command: ["/data"]

  vault:
    # renovate: datasource=docker depName=hashicorp/vault
    image: hashicorp/vault:2.2.1
    container_name: dev-vault
    profiles: ["vault"]
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    networks:
      picluster:
        ipv4_address: 172.30.100.11
    ports:
      - "127.0.0.1:8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:?set VAULT_DEV_ROOT_TOKEN in .env}
      # The `-dev` listener is container-local; 0.0.0.0:8200 is the TLS
      # listener from vault.hcl. The image entrypoint turns this variable into
      # `-dev-listen-address`, so do not repeat the flag in `command`.
      VAULT_DEV_LISTEN_ADDRESS: "127.0.0.1:8299"
      VAULT_ADDR: "https://127.0.0.1:8200"
      VAULT_CACERT: "/vault/certs/ca.crt"
    volumes:
      - ./vault.hcl:/vault/config/vault.hcl:ro
      - ./certs:/vault/certs:ro
    # The entrypoint already adds -config=/vault/config and
    # -dev-root-token-id, so only the mode flag is passed here.
    command: ["server", "-dev"]

networks:
  picluster:
    external: true
    name: picluster
