---
apiVersion: v1
kind: Namespace
metadata:
  name: velero-example
  labels:
    app: velero-example
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: velero-data
  namespace: velero-example
  labels:
    app: velero-example
spec:
  storageClassName: longhorn
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: velero-example
  namespace: velero-example
spec:
  replicas: 1
  selector:
    matchLabels:
      app: velero-example
  template:
    metadata:
      labels:
        app: velero-example
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: writer
          image: busybox:1.36.1
          command:
            - /bin/sh
            - -c
            - while true; do date -u +%FT%TZ >> /data/heartbeat.log; sleep 5; done
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: velero-data
