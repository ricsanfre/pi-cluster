# Phase A — in-tree Barman Cloud, the configuration both production clusters
# use today. This is the baseline the plugin must keep reading and extending.
# 2 instances so the phase B rolling restart can be observed.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-poc
  namespace: cnpg-barman
spec:
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6

  storage:
    size: 2Gi
    storageClass: local-path

  resources:
    requests:
      cpu: 50m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  postgresql:
    parameters:
      shared_buffers: "64MB"
      max_connections: "100"

  bootstrap:
    initdb: {}

  backup:
    barmanObjectStore:
      destinationPath: s3://k3s-barman/poc/cnpg-barman
      endpointURL: https://rustfs.picluster.local.test:9091
      endpointCA:
        name: rustfs-ca
        key: ca.crt
      s3Credentials:
        accessKeyId:
          name: cnpg-poc-s3
          key: AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cnpg-poc-s3
          key: AWS_SECRET_ACCESS_KEY
      data:
        compression: bzip2
      wal:
        compression: bzip2
        maxParallel: 8
    retentionPolicy: "7d"
