# POC-only namespace for the Barman Cloud plugin migration rehearsal.
# Not wired through Flux: test/cnpg-barman/poc.sh applies it and deletes it.
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-barman
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: cnpg-barman-quota
  namespace: cnpg-barman
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 2Gi
    limits.memory: 4Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: cnpg-barman-limits
  namespace: cnpg-barman
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      default:
        cpu: 500m
        memory: 256Mi
