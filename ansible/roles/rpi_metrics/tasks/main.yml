---
# node_exporter runs as a DaemonSet on every node, and the prod overlay mounts
# /var/lib/node_exporter/textfile into it via hostPath. Kubernetes does not
# create missing hostPath directories, so the directory must exist on every node
# or node-exporter fails to start there - including the x86 nodes, which never
# write any metrics.
#
# The collector itself only makes sense on Raspberry Pi hardware (vcgencmd), so
# it is installed on ARM nodes only.

- name: Create node_exporter textfile directory
  ansible.builtin.file:
    path: "{{ rpi_metrics_textfile_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Check for Raspberry Pi firmware tools
  ansible.builtin.stat:
    path: /usr/bin/vcgencmd
  register: rpi_metrics_vcgencmd

- name: Install Raspberry Pi metrics collector and timer
  ansible.builtin.include_tasks: collector.yml
  when: rpi_metrics_vcgencmd.stat.exists
