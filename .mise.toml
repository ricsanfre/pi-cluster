[tools]
# Versiones específicas verificadas (Mayo 2026)
# Single source of truth: kubectl, helm and opentofu are also baked into the
# ansible-runner image. Keep the two in step — `make check-runner-versions`
# (run by CI) fails when they disagree.
kubectl = "1.37.2"
flux2 = "2.10.1"
velero = "1.18.4"
istioctl = "1.32.0"
helm = "4.3.2"
opentofu = "1.13.10"

# Herramienta via GitHub Releases
"github:longhorn/cli" = "1.13.0"

# Versión más reciente estable
cilium-cli = "0.20.3"
